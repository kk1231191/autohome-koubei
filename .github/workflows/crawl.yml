name: 抓取汽车之家口碑

# 三种触发方式, 对应三类使用者:
#   workflow_dispatch —— 你自己用: 在 Actions 页面点按钮, 表单里填车型名
#   issues            —— 别人用: 任何有 GitHub 账号的人开一个 issue 就能申请抓取
#   schedule          —— 定时增量: 每天自动把关注车型的最新口碑补进来
on:
  workflow_dispatch:
    inputs:
      series:
        description: '车型名, 多个用逗号分隔 (如: 零跑C10,小米SU7)'
        required: true
        default: '零跑C10'
      pages:
        description: '每个车型抓取页数, 每页10条 (1-200)'
        required: false
        default: '3'
      full_text:
        description: '是否进详情页取全文'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  issues:
    # reopened 也要监听: 标题写坏了被提醒后, 改好标题再关掉重开即可重试,
    # 不用重新建一条 issue。
    types: [opened, reopened]
  schedule:
    # 每天 02:17 UTC = 北京时间 10:17。错开整点, 减少 runner 排队。
    # 只有仓库变量 CRAWL_SERIES 有值时才真的执行, 否则整个 job 跳过。
    - cron: '17 2 * * *'

# 同一时间只允许一个抓取任务。多人同时触发时后来的排队, 不并发跑 ——
# 并发会撞 git push, 也是对目标站点不礼貌。
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write      # 把抓到的 CSV 提交回仓库
  issues: write        # issue 触发时回评论
  actions: read

jobs:
  # ---------------------------------------------------------------- 预检
  # 只解析 issue 标题, 十几秒, 不装依赖不下浏览器。
  #
  # 为什么单独拆一个 job: 之前把"标题是否含触发词"写进 crawl 的 job 级 if,
  # 用户把标题写成「小米SU7」(丢掉 [抓取] 前缀)时整个任务被静默 skip ——
  # Actions 页面上什么都没有, issue 里也没有回复, 完全看不出发生了什么。
  # 现在无论标题写成什么样, 都至少会收到一条说明格式的评论。
  triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.parse.outputs.ok }}
      series: ${{ steps.parse.outputs.series }}
      pages: ${{ steps.parse.outputs.pages }}
      reason: ${{ steps.parse.outputs.reason }}
    steps:
      - name: 解析 issue 标题
        id: parse
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          AUTHOR: ${{ github.event.issue.user.login }}
          OWNER: ${{ github.repository_owner }}
          VAR_PAGES: ${{ vars.CRAWL_PAGES }}
        run: |
          python - <<'PY'
          import os, re, sys

          title = os.environ.get("ISSUE_TITLE", "") or ""
          body = os.environ.get("ISSUE_BODY", "") or ""
          author = (os.environ.get("AUTHOR") or "").lower()
          owner = (os.environ.get("OWNER") or "").lower()

          KW = re.compile(r"(?:申请|抓取|采集|爬取|补充|更新)")
          CJK = re.compile(r"[\u4e00-\u9fff]")
          # 明显的闲聊词, 不能当车型名
          NOISE = {"谢谢", "你好", "帮忙", "测试", "好的", "求助", "please", "test", "hello", "hi"}
          has_kw = bool(KW.search(title))

          def clean(t):
              # 先去掉 [抓取] 【申请】 (采集) 这样的整块标记 ——
              # 顺序不能反, 否则会剩一个孤立的反括号
              t = re.sub(r"[\[【（(][^\]】）)]*[\]】）)]", " ", t)
              t = KW.sub(" ", t)
              t = re.sub(r"^(?:\s|[:：,，、\-–—])+", "", t)
              return t.strip(" \t:：,，、。.!！?？")

          cand = clean(title)
          if not cand and body.strip():
              # 标题没内容就看正文第一行
              cand = clean(body.strip().splitlines()[0])

          series = re.sub(r"[，、;；/]+", ",", cand).strip(",")
          pages = os.environ.get("VAR_PAGES", "3") or "3"

          tokens = [t.strip() for t in series.split(",") if t.strip()]
          bad = [t for t in tokens
                 if len(t) > 40 or t.lower() in NOISE or not (CJK.search(t) or re.fullmatch(r"[A-Za-z0-9\-\. ]{2,}", t))]

          def out(**kw):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  for k, v in kw.items():
                      f.write(f"{k}={v}\n")

          # 陌生人开的 issue, 必须带触发词 —— 防止有人随便开 issue 就烧掉一次运行额度。
          # 仓库自己的 issue 页面按钮会预填 "[抓取] xxx", 正常走这条路不会丢关键词。
          if author != owner and not has_kw:
              out(ok="0", series="", pages=pages, reason="foreign")
              print("::warning::非仓库所有者的 issue 缺少触发词, 视为格式提示而非抓取请求")
              sys.exit(0)

          if not tokens or bad:
              out(ok="0", series="", pages=pages, reason="format")
              print("::warning::标题里没解析出可用车型名")
              sys.exit(0)

          out(ok="1", series=",".join(tokens), pages=pages, reason="")
          print(f"识别到车型: {','.join(tokens)} / {pages} 页")
          PY

      - name: 标题不合规时给出提示
        if: steps.parse.outputs.ok != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          REASON: ${{ steps.parse.outputs.reason }}
        run: |
          python - <<'PY'
          import os
          reason = os.environ.get("REASON", "")
          if reason == "foreign":
              lines = [
                  "这条 issue 没有识别到抓取指令，不会触发任务（避免无关 issue 占用抓取额度）。",
                  "",
                  "如果要申请抓取，请把标题改成下面这种形式，然后**关掉再重新打开**这条 issue：",
                  "",
                  "```",
                  "[抓取] 零跑C10",
                  "[抓取] 零跑C10, 小米SU7",
                  "```",
                  "",
                  "或者回到数据页，在右上角输入车型名后点「申请抓取」。",
              ]
          else:
              lines = [
                  "没从标题里读到车型名，这次没有开始抓取。",
                  "",
                  "请把标题改成 `[抓取] 车型名`（多个车型用逗号分隔），"
                  "然后**关掉再重新打开**这条 issue，就会重新触发：",
                  "",
                  "```",
                  "[抓取] 铂智3X",
                  "[抓取] 铂智3X, 小米SU7",
                  "```",
                  "",
                  "判断车型名的依据是汽车之家车系名，例如 `零跑C10`、`小米SU7`、`铂智3X`。",
              ]
          lines += ["", f"（自动回复，本次未消耗抓取任务）"]
          body = "\n".join(lines)
          with open("comment.md", "w", encoding="utf-8") as f:
              f.write(body)
          print(body)
          PY
          gh issue comment "$ISSUE_NUM" --repo "$REPO" --body-file comment.md || true
          gh issue edit "$ISSUE_NUM" --repo "$REPO" --add-label "needs-format" || true

  # ---------------------------------------------------------------- 抓取
  crawl:
    needs: [triage]
    # always() 不能省: triage 在 dispatch/schedule 下是 skipped,
    # 没有 always() 时 needs 被跳过会把 crawl 一起带跳过。
    if: >-
      always() && (
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'schedule' && vars.CRAWL_SERIES != '') ||
      (github.event_name == 'issues' && needs.triage.outputs.ok == '1'))
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 取出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # push 前要 rebase, 浅克隆会报 shallow update not allowed

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # 参数归一: 把三种触发方式统一成 SERIES / PAGES / FULL_TEXT 环境变量。
      # issue 标题必须经 env 传入, 不能内插到脚本里 —— 那是命令注入。
      # issue 的标题解析只在 triage 里做一次, 这里直接读它的输出, 避免两处逻辑跑偏。
      - name: 解析参数
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_SERIES: ${{ inputs.series }}
          IN_PAGES: ${{ inputs.pages }}
          IN_FULL_TEXT: ${{ inputs.full_text }}
          TRIAGE_SERIES: ${{ needs.triage.outputs.series }}
          TRIAGE_PAGES: ${{ needs.triage.outputs.pages }}
          VAR_SERIES: ${{ vars.CRAWL_SERIES }}
          VAR_PAGES: ${{ vars.CRAWL_PAGES }}
        run: |
          python - <<'PY'
          import os, re, sys

          ev = os.environ.get("EVENT_NAME", "")
          full = "true"

          if ev == "workflow_dispatch":
              series = os.environ.get("IN_SERIES", "")
              pages = os.environ.get("IN_PAGES", "3")
              full = os.environ.get("IN_FULL_TEXT", "true")
          elif ev == "schedule":
              series = os.environ.get("VAR_SERIES", "")
              pages = os.environ.get("VAR_PAGES", "2") or "2"
          elif ev == "issues":
              series = os.environ.get("TRIAGE_SERIES", "")
              pages = os.environ.get("TRIAGE_PAGES", "3") or "3"
              if not series.strip():
                  print("::error::预检没有解析出车型名, 不应走到这里")
                  sys.exit(1)
          else:
              print(f"::error::未知的触发方式 {ev}")
              sys.exit(1)

          if not series.strip():
              print("::error::没有指定车型")
              sys.exit(1)

          # 中英文逗号 / 顿号 / 分号 / 空白都当分隔符
          series = re.sub(r"[，、;；\s]+", ",", series).strip(",")
          try:
              pages = str(max(1, min(200, int(pages))))
          except ValueError:
              pages = "3"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"SERIES={series}\n")
              f.write(f"PAGES={pages}\n")
              f.write(f"FULL_TEXT={full}\n")
          print(f"车型={series} 页数={pages} 详情页={full}")
          PY

      - name: 安装依赖
        continue-on-error: true   # runner 预装了 Chrome 及其依赖, 补装失败也能跑
        # apt 源偶尔会长时间无响应。不设超时的话这一步默认能挂 6 小时,
        # 而且 concurrency 是串行的, 会把后面所有任务一起堵死(实测踩过)。
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Playwright 驱动 chromium 需要的系统库(libnss3/libatk/libgbm 等)。
          # runner 上大多已预装, 这步通常是幂等的快速检查, 20-40 秒。
          python -m playwright install-deps chromium

      # 浏览器 150MB, 每次下载太慢。缓存命中后这步只要几秒。
      # key 带版本号; 想换版本时改 setup_browser.py 的 DEFAULT_VERSION, key 也要同步改。
      - name: 缓存浏览器
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: browsers
          key: cft-linux64-148.0.7778.96

      - name: 准备浏览器
        if: steps.browser-cache.outputs.cache-hit != 'true'
        continue-on-error: true   # 下载失败不致命: 下一步会退回 runner 自带的 /usr/bin/google-chrome
        timeout-minutes: 10       # 175MB, 镜像正常时十几秒, 卡住就快速放弃
        run: python setup_browser.py

      - name: 自检浏览器
        run: python setup_browser.py --check

      # CI 每次都是全新环境, output/ 被 .gitignore 排除, 所以抓之前必须把上次的
      # 数据从 docs/data 还原回来 —— 否则 existing_ids() 永远是空集,
      # 去重失效、每次都用"本次结果"覆盖掉历史(docs/data 会被 cp 覆盖)。
      - name: 恢复历史数据
        run: |
          mkdir -p output
          if [ -f docs/data/koubei.csv ]; then
            cp docs/data/koubei.csv output/autohome_koubei.csv
            # 不能用 wc -l 数行数: 口碑全文里有换行符, 会多算
            python -c "import csv;print('历史数据:', len(list(csv.reader(open('output/autohome_koubei.csv',encoding='utf-8-sig'))))-1, '行')"
          else
            echo "仓库里没有历史数据, 本次是首次抓取"
          fi

      - name: 执行抓取
        timeout-minutes: 30       # 兜底: 单车型 200 页约需 10 分钟
        run: |
          SERIES_SP=$(echo "$SERIES" | tr ',' ' ')
          echo "开始抓取: $SERIES_SP | 页数 $PAGES"
          EXTRA=""
          [ "$FULL_TEXT" = "false" ] && EXTRA="--no-detail"
          python main.py --series $SERIES_SP --pages "$PAGES" \
                         --csv autohome_koubei.csv $EXTRA

      - name: 生成结果摘要
        if: always()
        run: |
          python - <<'PY'
          import csv, glob, os
          rows = []
          for p in sorted(glob.glob("output/*.csv")):
              try:
                  with open(p, encoding="utf-8-sig") as f:
                      n = len(list(csv.reader(f))) - 1
                  rows.append((os.path.basename(p), n, os.path.getsize(p)))
              except Exception:
                  rows.append((os.path.basename(p), -1, 0))
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(path, "a", encoding="utf-8") as f:
                  f.write("## 抓取结果\n\n| 文件 | 累计条数 | 大小 |\n|---|---|---|\n")
                  for name, n, sz in rows:
                      f.write(f"| {name} | {n} | {sz/1024:.1f} KB |\n")
                  f.write(f"\n车型 `{os.environ.get('SERIES','')}` / "
                          f"{os.environ.get('PAGES','')} 页\n")
          print(rows)
          PY

      # Pages 只能发布 /docs 目录, 所以要把 CSV 同步一份进去
      - name: 同步到展示页
        if: always()
        run: |
          mkdir -p docs/data
          [ -f output/autohome_koubei.csv ] && cp output/autohome_koubei.csv docs/data/koubei.csv
          cat > docs/data/meta.json <<EOF
          {
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "series": "$SERIES",
            "pages": "$PAGES",
            "repo": "${{ github.repository }}",
            "status": "${{ job.status }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: 提交结果
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只提交 docs/data 下的展示副本; output/*.csv 被 .gitignore 排除,
          # 避免同一份数据在仓库里存两份
          git add -A docs/data
          if git diff --cached --quiet; then
            echo "没有新数据, 跳过提交"
            exit 0
          fi
          git commit -m "data: $SERIES ($PAGES 页) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "提交成功"; break
            fi
            echo "第 $i 次 push 失败, 5 秒后重试"; sleep 5
          done

      - name: 归档日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-${{ github.run_id }}
          path: |
            logs/
            output/*.csv
            docs/data/meta.json
          retention-days: 30
          if-no-files-found: ignore

      # 别人开的 issue, 抓完回一条评论
      - name: 回复 issue
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERIES_ENV: ${{ needs.triage.outputs.series }}
        run: |
          python - <<'PY'
          import collections, csv, os, re

          series_raw = os.environ.get("SERIES_ENV", "") or os.environ.get("SERIES", "")
          pages = os.environ.get("PAGES", "")
          status = os.environ.get("JOB_STATUS", "")
          run_url = os.environ.get("RUN_URL", "")
          owner, name = os.environ["REPO"].split("/", 1)
          site = f"https://{owner}.github.io/{name}/"

          # 每个车型在库里有多少条 —— 这比"成功"两个字有用得多
          per, total = collections.Counter(), 0
          try:
              with open("output/autohome_koubei.csv", encoding="utf-8-sig") as f:
                  rows = list(csv.reader(f))
              total = len(rows) - 1
              for r in rows[1:]:
                  if len(r) > 2:
                      per[r[2]] += 1
          except Exception:
              pass

          # 失败时把日志里最后几条关键行贴出来, 省得再去翻 Actions
          tail = []
          try:
              with open("logs/autohome_spider.log", encoding="utf-8", errors="replace") as f:
                  lines = f.read().splitlines()
              keys = [l for l in lines if re.search(r"(未找到|失败|错误|异常|超时|403|完成:)", l)]
              tail = [re.sub(r"^\S+ \S+ \w+\s+", "", l).strip() for l in keys[-6:]]
          except Exception:
              pass

          if status == "success":
              lines = [f"抓取完成：**{series_raw}**（{pages} 页）。", ""]
              for s, n in per.items():
                  lines.append(f"- {s}：{n} 条")
              lines += ["", f"库内合计 {total} 条口碑。", "",
                        f"- 查看与下载：{site}", f"- 运行日志：{run_url}"]
              if not per:
                  lines.insert(1, "> 注意：这次没有抓到任何记录，车型名可能不是汽车之家的车系名。")
          else:
              lines = [f"抓取 **{series_raw}** 失败（状态：{status}）。", ""]
              if tail:
                  lines += ["日志关键行：", "```", *tail, "```", ""]
              lines += [f"完整日志：{run_url}", "",
                        "常见原因：车型名不是汽车之家的车系名、目标站点临时限制访问。"]

          body = "\n".join(lines)
          with open("comment.md", "w", encoding="utf-8") as f:
              f.write(body)
          print(body)
          PY
          gh issue comment "$ISSUE_NUM" --repo "$REPO" --body-file comment.md || true
