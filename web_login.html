<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>需要访问口令 · 汽车之家口碑抓取台</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --line: #e4e7ec;
    --ink: #101828; --ink-2: #475467; --ink-3: #98a2b3;
    --primary: #2f5fe0; --primary-dark: #2449b5; --err: #b42318; --err-bg: #fef3f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: grid; place-items: center; padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .box {
    width: 100%; max-width: 372px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 28px 26px 26px;
    box-shadow: 0 12px 32px -16px rgba(16,24,40,.16);
  }
  .logo {
    width: 38px; height: 38px; border-radius: 10px; margin-bottom: 16px;
    background: linear-gradient(140deg, #2f5fe0, #5b8def);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 16px;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  p.desc { font-size: 13px; color: var(--ink-2); margin: 0 0 20px; line-height: 1.6; }
  label { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
  input[type=password] {
    width: 100%; padding: 9px 12px; font: inherit; font-size: 14px; color: var(--ink);
    background: #fcfcfd; border: 1px solid var(--line); border-radius: 8px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=password]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(47,95,224,.1); background: #fff; }
  button {
    width: 100%; margin-top: 14px; padding: 9px 16px; font: inherit; font-size: 14px;
    font-weight: 500; color: #fff; background: var(--primary); border: none;
    border-radius: 8px; cursor: pointer; transition: background .15s;
  }
  button:hover { background: var(--primary-dark); }
  .err {
    margin-top: 12px; padding: 8px 11px; border-radius: 7px; font-size: 12.5px;
    color: var(--err); background: var(--err-bg); border: 1px solid #fecdca;
  }
  .foot { margin-top: 18px; font-size: 11.5px; color: var(--ink-3); line-height: 1.6; }
</style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <div class="logo">口</div>
    <h1>需要访问口令</h1>
    <p class="desc">这是一个私有工具，抓取任务在分享者的电脑上执行。请输入对方给你的访问口令。</p>

    <label for="token">访问口令</label>
    <input type="password" id="token" name="token" autocomplete="current-password"
           placeholder="粘贴口令" autofocus required>

    <!--ERR-->

    <button type="submit">进入</button>

    <div class="foot">
      提示：如果分享者给你的是带 <code>?k=</code> 的完整链接，直接打开即可，无需手动输入。
    </div>
  </form>
</body>
</html>
